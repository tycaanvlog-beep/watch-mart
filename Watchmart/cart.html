<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Watchmart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .cart-container { max-width: 850px; margin: 35px auto; padding: 0 20px; }
    .cart-item {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: var(--shadow);
      gap: 15px;
    }
    .cart-item img {
      width: 90px; height: 90px;
      object-fit: cover; border-radius: 8px;
      flex-shrink: 0;
    }
    .item-details { flex: 1; }
    .item-name { font-weight: 700; color: var(--primary); margin-bottom: 5px; }
    .item-price { color: var(--danger); font-weight: bold; }
    .qty-controls {
      display: flex; align-items: center; gap: 12px; margin-top: 10px;
    }
    .qty-btn {
      width: 30px; height: 30px;
      border: 2px solid #ddd; border-radius: 50%;
      background: none; cursor: pointer;
      font-size: 1rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .qty-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .remove-btn {
      background: none; border: none;
      color: var(--danger); cursor: pointer; font-size: 1.1rem;
    }
    .cart-summary-box {
      background: white; border-radius: 12px;
      padding: 25px; box-shadow: var(--shadow); margin-top: 20px;
    }
    .cart-page-title {
      font-size: 1.6rem; color: var(--primary);
      margin-bottom: 25px; font-weight: 800;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" onclick="location.href='index.html'">
      ⌚ Watch<span>mart</span>
    </div>
    <button class="cart-btn">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <div class="cart-container">
    <h1 class="cart-page-title">🛒 Your Shopping Cart</h1>

    <!-- Cart Items -->
    <div id="cartItems"></div>

    <!-- Summary -->
    <div class="cart-summary-box" id="cartSummary" style="display:none;">
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="cartSubtotal">PKR 0</span>
      </div>
      <div class="summary-row">
        <span>Delivery Charge</span>
        <span style="color:var(--danger);">PKR 300</span>
      </div>
      <div class="summary-row total">
        <span>Total Amount</span>
        <span id="cartTotal">PKR 300</span>
      </div>

      <div style="display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;">
        <button class="btn-primary" style="flex:1;"
                onclick="location.href='checkout.html'">
          Proceed to Checkout →
        </button>
        <button class="btn-secondary" style="flex:1;"
                onclick="location.href='index.html'">
          ← Continue Shopping
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      getCart, updateQuantity, removeFromCart, getCartTotals, updateCartCount
    } from './js/cart.js';

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cartItems');
      const summary = document.getElementById('cartSummary');
      updateCartCount();

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🛒</div>
            <h3>Your cart is empty!</h3>
            <p style="margin:10px 0 25px; color:#888;">
              Add some amazing watches to get started
            </p>
            <button class="btn-primary" onclick="location.href='index.html'">
              Browse Watches
            </button>
          </div>`;
        summary.style.display = 'none';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.imageUrl}" alt="${item.name}"
               onerror="this.src='https://via.placeholder.com/90?text=Watch'">
          <div class="item-details">
            <p class="item-name">${item.name}</p>
            <p class="item-price">PKR ${item.price.toLocaleString()} each</p>
            <div class="qty-controls">
              <button class="qty-btn" 
                      onclick="changeQty('${item.id}', -1)">−</button>
              <span style="font-weight:bold; font-size:1.1rem;">
                ${item.quantity}
              </span>
              <button class="qty-btn" 
                      onclick="changeQty('${item.id}', 1)">+</button>
            </div>
          </div>
          <div style="text-align:right; flex-shrink:0;">
            <p style="font-weight:bold; color:var(--primary); font-size:1.05rem;">
              PKR ${(item.price * item.quantity).toLocaleString()}
            </p>
            <button class="remove-btn" onclick="deleteItem('${item.id}')"
                    title="Remove item">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');

      const { subtotal, total } = getCartTotals();
      document.getElementById('cartSubtotal').textContent =
        `PKR ${subtotal.toLocaleString()}`;
      document.getElementById('cartTotal').textContent =
        `PKR ${total.toLocaleString()}`;
      summary.style.display = 'block';
    }

    window.changeQty = function (id, change) {
      updateQuantity(id, change);
      renderCart();
    };

    window.deleteItem = function (id) {
      removeFromCart(id);
      renderCart();
    };

    renderCart();
  </script>
</body>
</html>
