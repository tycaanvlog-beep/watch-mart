<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Watchmart</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: white;
      border-radius: 18px;
      padding: 45px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo .icon { font-size: 3rem; display:block; margin-bottom:8px; }
    .logo h2 { color: #1a1a2e; font-size: 1.5rem; }
    .logo p  { color: #888; font-size: 0.9rem; margin-top: 5px; }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #555;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 13px 15px;
      border: 2px solid #eee;
      border-radius: 9px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
      font-family: inherit;
    }

    .form-group input:focus { border-color: #f0c040; }

    .error-box {
      background: #fde8e8;
      color: #e74c3c;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }

    .success-box {
      background: #d4edda;
      color: #155724;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #1a1a2e;
      color: #f0c040;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-login:hover:not(:disabled) {
      background: #f0c040;
      color: #1a1a2e;
    }

    .btn-login:disabled {
      background: #ccc;
      color: #888;
      cursor: not-allowed;
    }

    .debug-box {
      margin-top: 20px;
      padding: 12px;
      background: #f8f8f8;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #666;
    }

    .debug-box p { margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="login-box">

    <div class="logo">
      <span class="icon">⌚</span>
      <h2>Watchmart Admin</h2>
      <p>Sign in to manage your store</p>
    </div>

    <!-- Error Message -->
    <div class="error-box" id="errorBox"></div>

    <!-- Success Message -->
    <div class="success-box" id="successBox"></div>

    <!-- Form -->
    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        id="adminEmail"
        placeholder="admin@watchmart.com"
        value="admin@watchmart.com"
      >
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Enter password"
        onkeydown="if(event.key==='Enter') login()"
      >
    </div>

    <button class="btn-login" id="loginBtn" onclick="login()">
      🔐 Sign In
    </button>

    <!-- Debug Info -->
    <div class="debug-box" id="debugBox">
      <p>⏳ Checking Supabase connection...</p>
    </div>

  </div>

  <script type="module" src="../js/admin.js"></script>

</body>
</html>
