<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed — Watchmart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #1a1a2e, #16213e);
             min-height: 100vh; display: flex;
             align-items: center; justify-content: center;">

  <div style="background: white; border-radius: 20px; padding: 50px 35px;
              max-width: 480px; width: 90%; text-align: center;
              box-shadow: 0 20px 60px rgba(0,0,0,0.3);">

    <div style="font-size: 5rem; margin-bottom: 15px; 
                animation: bounce 0.6s ease;">✅</div>

    <h1 style="color: var(--primary); font-size: 1.8rem; margin-bottom: 10px;">
      Order Placed Successfully!
    </h1>

    <div style="background: #fffbee; border: 2px solid var(--accent);
                border-radius: 12px; padding: 20px; margin: 25px 0;">
      <p style="font-size: 1rem; color: #555; line-height: 1.7;">
        ⏳ <strong>Please wait for confirmation.</strong><br>
        We will notify you via <strong>WhatsApp</strong> shortly! 📱
      </p>
    </div>

    <p style="color: #888; font-size: 0.9rem; margin-bottom: 30px;">
      Order verification takes 1-2 hours.<br>
      Thank you for choosing Watchmart! ❤️
    </p>

    <button class="btn-primary" style="width: 100%; font-size: 1rem;"
            onclick="location.href='index.html'">
      🛍️ Continue Shopping
    </button>
  </div>

  <style>
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
</body>
</html>
